# Initial HTTP setup. Enable HTTPS with cinescope-nginx.conf after issuing its certificate.
server {
    listen 127.0.0.1:18081;
    server_name localhost;
    root /srv/cinescope/current;
    include /etc/nginx/cinescope-static.inc;
}
server {
    listen 80;
    server_name movie.lrwei91.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://movie.lrwei91.cn$request_uri; }
}
