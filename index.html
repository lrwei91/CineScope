<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope｜全球影视片单</title>
    <link rel="icon" href="favicon.svg?v=20260811b" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.png?v=20260811b" type="image/png">
    <!-- Inline style prevents FOUC by setting the canvas immediately. -->
    <style>
        html { background: #FFFFFF; color-scheme: light; }
        body { min-height: 100dvh; }
    </style>
    <link rel="stylesheet" href="style.css?v=20260813b">
    <link rel="stylesheet" href="share.css?v=20260811b">
    <script type="module" src="app.js?v=20260813a"></script>
</head>
<body>
    <div class="page-shell">
        <div class="container">
            <nav class="mobile-nav-bar" id="mobile-nav-bar" aria-label="站点导航">
                <a class="mobile-brand" href="#page-top" aria-label="返回 CineScope 首页">CINESCOPE</a>
            </nav>

            <header class="hero-header" id="page-top">
                <div class="hero-copy">
                    <h1 id="page-title-text" aria-label="鲤鱼 环球 片单">
                        <span class="hero-title-line">鲤鱼</span>
                        <span class="hero-title-line hero-title-line-accent">环球</span>
                        <span class="hero-title-line">片单</span>
                    </h1>
                    <p class="hero-description">国产剧、院线电影、综艺与海外剧集，按上映时间、评分和类型浏览。</p>
                    <div class="hero-meta">
                        <small class="update-date skeleton" aria-live="polite"></small>
                        <div class="hero-auth" id="douban-sync-badge">
                            <span class="hero-auth-icon">豆瓣同步</span>
                            <span id="douban-auth-status" class="hero-auth-status" aria-live="polite">正在读取状态...</span>
                        </div>
                    </div>
                </div>
                <figure class="hero-art" aria-hidden="true">
                    <img src="assets/illustrations/cinescope-koi-film.png" width="1254" height="1254" alt="" loading="lazy" fetchpriority="low" decoding="async">
                </figure>
            </header>

            <noscript>
                <div class="no-script-notice">片单数据与筛选需要 JavaScript。请启用后刷新页面，目录题头仍可正常浏览。</div>
            </noscript>

            <section id="catalog-controls" class="catalog-controls reveal-section" aria-label="片单分类与筛选">
                <nav class="category-navigation" aria-label="影视分类">
                    <span class="category-navigation-label">分类</span>
                    <div id="category-filter-container" class="network-filter-container category-tabs">
                        <button class="genre-tag active" type="button" data-category="tv_cn" aria-pressed="true">国产剧</button>
                        <button class="genre-tag" type="button" data-category="movie_cn" aria-pressed="false">院线电影</button>
                        <button class="genre-tag" type="button" data-category="tv_cn_variety" aria-pressed="false">综艺</button>
                        <button class="genre-tag" type="button" data-category="tv_kr" aria-pressed="false">韩剧</button>
                        <button class="genre-tag" type="button" data-category="tv_jp" aria-pressed="false">日剧</button>
                        <button class="genre-tag" type="button" data-category="tv_us" aria-pressed="false">美剧</button>
                        <button class="genre-tag" type="button" data-category="douban_top250" aria-pressed="false">豆瓣Top250</button>
                    </div>
                </nav>

                <nav class="filters-navigation" aria-label="影视筛选">
                <div class="search-container">
                    <input type="search" id="radar-search" placeholder="搜索片名、别名或关键词" autocomplete="off" aria-label="搜索片单">
                    <span class="search-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" focusable="false">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
                            <path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                        </svg>
                    </span>
                </div>
                <div class="filter-row filter-row-primary">
                    <section class="filter-block">
                        <p class="filter-label">评分</p>
                        <div id="rating-filter-container" class="network-filter-container filter-pill-row">
                            <span class="genre-tag skeleton">全部</span>
                            <span class="genre-tag skeleton">&gt; 9分</span>
                            <span class="genre-tag skeleton">&gt; 8分</span>
                            <span class="genre-tag skeleton">&gt; 7分</span>
                            <span class="genre-tag skeleton">近2年高分</span>
                        </div>
                    </section>
                </div>
                </nav>

                <div class="sticky-header">
                <div class="filter-block filter-block-genre">
                    <div class="filter-label-row">
                        <p class="filter-label">类型</p>
                        <button id="genre-filter-toggle" class="filter-toggle" type="button" hidden>展开</button>
                    </div>
                    <div id="genre-filter-container" class="genre-filter-container filter-pill-row">
                        <span class="genre-tag skeleton">全部</span>
                        <span class="genre-tag skeleton">剧情</span>
                        <span class="genre-tag skeleton">喜剧</span>
                        <span class="genre-tag skeleton">悬疑</span>
                        <span class="genre-tag skeleton">犯罪</span>
                        <span class="genre-tag skeleton">科幻</span>
                    </div>
                </div>
                </div>
            </section>

            <div class="file-loader">
                <p id="status-message" data-state="loading">正在尝试加载默认数据文件...</p>
                <input type="file" id="file-input" accept=".json">
                <label for="file-input" class="file-label">或手动选择一个JSON文件</label>
            </div>

            <main id="main-content">
                <!-- 返回顶部按钮 -->
                <button id="back-to-top" class="back-to-top-btn" type="button" aria-label="返回顶部" hidden>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 15l-6-6-6 6"/>
                    </svg>
                </button>
                <section id="coming-soon-section" class="content-section reveal-section">
                    <div id="coming-soon-container" style="display: none;">
                        <h2 class="month-group-header skeleton">即将上映</h2>
                        <div class="scroller-wrapper">
                            <div class="scroller-container">
                                <div class="horizontal-scroller">
                                    <div class="show-card skeleton"></div>
                                    <div class="show-card skeleton"></div>
                                    <div class="show-card skeleton"></div>
                                    <div class="show-card skeleton"></div>
                                    <div class="show-card skeleton"></div>
                                    <div class="show-card skeleton"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="results-section" class="content-section reveal-section">
                    <div id="results-container">
                        <!-- Skeleton Loader -->
                        <div id="skeleton-container" style="display: none;">
                            <h2 class="month-group-header skeleton">&nbsp;</h2>
                            <div class="month-grid">
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                            </div>
                            <h2 class="month-group-header skeleton">&nbsp;</h2>
                            <div class="month-grid">
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                                <div class="show-card skeleton"></div>
                            </div>
                        </div>
                    </div>
                    <div id="no-results" data-state="empty" style="display: none;">没有找到符合条件的内容。</div>
                    <div id="loader" class="loader" style="display: none;"></div>
                </section>
            </main>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="loader"></div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast-notification" class="toast-notification"></div>
    
    <!-- Mobile Bottom Filter FAB -->
    <button id="mobile-filter-fab" class="mobile-filter-fab" aria-label="打开筛选">
        <span class="fab-icon" aria-hidden="true">☰</span>
        <span class="fab-text">筛选片单</span>
        <span id="fab-active-badge" class="fab-badge" hidden></span>
    </button>

    <!-- Mobile Filter Action Sheet Overlay -->
    <div class="mobile-sheet-overlay" id="mobile-sheet-overlay"></div>

    <!-- Mobile Filter Action Sheet -->
    <div class="mobile-filter-sheet" id="mobile-filter-sheet" role="dialog" aria-modal="true" aria-labelledby="mobile-filter-sheet-title" aria-hidden="true" inert>
        <div class="sheet-drag-handle"></div>
        <div class="sheet-header">
            <span class="sheet-title" id="mobile-filter-sheet-title">筛选片单</span>
            <button class="sheet-close-btn" id="close-filter-sheet" type="button" aria-label="关闭筛选面板">&times;</button>
        </div>
        <div class="sheet-content">
            <!-- Search -->
            <div class="sheet-search-container">
                <input type="search" id="mobile-sheet-search" placeholder="搜索片名、别名或关键词" autocomplete="off" aria-label="搜索片单">
            </div>
            <!-- Rating -->
            <div class="sheet-section">
                <p class="sheet-section-label">评分</p>
                <div id="mobile-rating-mirror" class="sheet-pills-row"></div>
            </div>
            <!-- Genre -->
            <div class="sheet-section">
                <p class="sheet-section-label">类型</p>
                <div id="mobile-genre-mirror" class="sheet-pills-row"></div>
            </div>
        </div>
        <!-- Douban sync status footer -->
        <div class="sheet-footer">
            <span class="sheet-footer-label">豆瓣同步</span>
            <span id="mobile-douban-status" class="sheet-footer-status">加载中...</span>
        </div>
    </div>

    <!-- Intel Dossier Slide-out Modal -->
    <div id="intel-dossier-overlay" class="dossier-overlay" aria-hidden="true"></div>
    <aside id="intel-dossier" class="dossier-drawer" role="dialog" aria-modal="true" aria-labelledby="dossier-title" aria-hidden="true" inert>
        <button id="close-dossier-btn" class="close-btn" type="button" aria-label="关闭面板">&times;</button>
        <div class="dossier-content">
                <div class="dossier-visual">
                    <div class="dossier-poster-container">
                        <img id="dossier-poster" src="" alt="详情海报">
                        <div id="dossier-status-badge" hidden></div>
                    </div>
                </div>
            <div class="dossier-data">
                <div class="dossier-header-main">
                    <h2 id="dossier-title"></h2>
                    <button id="share-dossier-btn" class="dossier-inline-share-btn" type="button" title="分享剧集档案">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                            <polyline points="16 6 12 2 8 6"></polyline>
                            <line x1="12" y1="2" x2="12" y2="15"></line>
                        </svg>
                    </button>
                </div>
                <h3 id="dossier-subtitle"></h3>
                
                <div class="dossier-metrics">
                    <div class="metric-box">
                        <span class="metric-label">豆瓣评分</span>
                        <span id="dossier-rating" class="metric-value"></span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">上映日期</span>
                        <span id="dossier-date" class="metric-value"></span>
                    </div>
                </div>

                <div class="dossier-facts-section">
                    <p class="dossier-section-title">核心信息</p>
                    <div class="dossier-facts-list">
                        <div id="dossier-directors-row" class="dossier-fact-row" hidden>
                            <span class="dossier-fact-label">导演</span>
                            <span id="dossier-directors" class="dossier-fact-value"></span>
                        </div>
                        <div id="dossier-actors-row" class="dossier-fact-row" hidden>
                            <span class="dossier-fact-label">主演</span>
                            <span id="dossier-actors" class="dossier-fact-value"></span>
                        </div>
                    </div>
                </div>

                <div id="dossier-overview-section" class="dossier-overview-section" hidden>
                    <p class="dossier-section-title">剧情简介</p>
                    <p id="dossier-overview" class="dossier-overview-text"></p>
                </div>

                <div class="dossier-tags-section">
                    <p class="dossier-section-title">分类标签</p>
                    <div id="dossier-tags" class="dossier-tag-row"></div>
                </div>

                <div class="dossier-tags-section">
                    <p class="dossier-section-title">播出平台</p>
                    <div id="dossier-networks" class="dossier-tag-row"></div>
                </div>

                <div id="dossier-trailers-section" class="dossier-tags-section" hidden>
                    <p class="dossier-section-title">预告片</p>
                    <div id="dossier-trailers" class="dossier-trailer-row"></div>
                </div>

                <div class="dossier-actions">
                    <p class="dossier-section-title">外部链接</p>
                    <div class="dossier-share-row" style="display: none;"></div>
                    <div id="dossier-links-container" class="dossier-links-row">
                        <!-- Action links will be injected here -->
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <div id="trailer-modal-overlay" class="trailer-modal-overlay" aria-hidden="true"></div>
    <section id="trailer-modal" class="trailer-modal" role="dialog" aria-modal="true" aria-labelledby="trailer-modal-title" aria-hidden="true" inert>
        <button id="close-trailer-modal-btn" class="close-btn" type="button" aria-label="关闭预告片弹层">&times;</button>
        <div class="trailer-modal-content">
            <div class="trailer-player-shell">
                <iframe
                    id="trailer-modal-frame"
                    class="trailer-modal-frame"
                    src=""
                    title="预告片播放器"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="no-referrer"
                ></iframe>
            </div>
            <div class="trailer-modal-meta">
                <p class="dossier-subtext">Bilibili 预告片</p>
                <h2 id="trailer-modal-title" class="trailer-modal-title"></h2>
                <p id="trailer-modal-subtitle" class="trailer-modal-subtitle"></p>
                <div id="trailer-modal-list" class="trailer-list-row"></div>
                <a id="trailer-modal-link" class="trailer-modal-link" href="" target="_blank" rel="noopener noreferrer">前往 B 站播放</a>
            </div>
        </div>
    </section>
</body>
</html>
