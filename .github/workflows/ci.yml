name: 持续集成

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: python3 -m pip install --break-system-packages -r scripts/automation/requirements.txt

      - name: 验证代码、数据与 Pages 产物
        run: npm run check && npm run build:site
