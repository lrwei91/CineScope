name: 每日数据更新

on:
  schedule:
    # 北京时间 22:00 (UTC 14:00)
    - cron: '0 14 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 恢复豆瓣详情缓存
        uses: actions/cache@v4
        with:
          path: .cache/douban/subjects
          key: douban-subjects-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            douban-subjects-${{ runner.os }}-

      - name: 更新猫眼缓存
        run: node scripts/generate_maoyan_cache.mjs

      - name: 更新影视数据
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/generate_douban_catalog.mjs

      - name: 检查是否有变更
        id: git-check
        run: |
          git add json/ posters/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交并推送变更
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git commit -m "chore: 每日数据更新 $(date '+%Y-%m-%d')"
          git push

      - name: 完成通知
        if: steps.git-check.outputs.has_changes == 'false'
        run: echo "数据无变更"
