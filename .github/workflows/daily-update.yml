name: 每日数据更新

on:
  schedule:
    # 北京时间 22:00 (UTC 14:00)
    - cron: '0 14 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: python3 -m pip install --break-system-packages -r scripts/automation/requirements.txt

      - name: 运行代码测试
        run: npm run check:syntax && npm test

      - name: 配置 Git 提交身份
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

      - name: 验证 TMDB API Key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY is not configured. Data quality will be reduced."
            echo "tmdb_available=false" >> "$GITHUB_ENV"
          else
            echo "tmdb_available=true" >> "$GITHUB_ENV"
          fi

      - name: 恢复数据源缓存
        uses: actions/cache@v4
        with:
          path: |
            .cache/douban/subjects
            .cache/douban/search
            .cache/bilibili
          key: cinescope-sources-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cinescope-sources-${{ runner.os }}-

      - name: 生成、验证并发布数据
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/automation/run_update.py --task full --publish | tee /tmp/cinescope-update.log

      - name: 生成更新摘要
        if: always()
        run: |
          echo "## 每日更新摘要" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**TMDB**: ${tmdb_available:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f json/build_report.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 数据质量" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.categories[] | "\(.id): \(.quality.total_items) items, rating missing: \(.quality.missing_rate.rating * 100 | round)%"' json/build_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/cinescope-update.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 任务结果" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 /tmp/cinescope-update.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
